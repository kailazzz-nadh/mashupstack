<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">

<body>
     <h1 class="display-3">Feedback Form</Form></h1>
    <form>
        
        <fieldset class="border border-5 border-dark mx-4 mb-4">
            <legend>FeedBack</legend>
            
        <div class="mb-3 mx-2">
    <label for="exampleInputPassword1" class="form-label">Name</label>
    <input type="text" class="form-control" id="exampleInputPassword1">
  </div>
  <div class="mb-3 mx-2">
    <label for="exampleInputEmail1" class="form-label">Email address</label>
    <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp">
    <div id="emailHelp" class="form-text">We'll never share your email with anyone else.</div>
  </div>
    <div class="form-floating">
  <textarea class="form-control" placeholder="Leave a comment here" id="floatingTextarea2" style="height: 100px"></textarea>
  <label for="floatingTextarea2">Feedback</label>
</div><br>
<h2>Contact us</h2>
<div class="form-check form-check-inline">
  <input class="form-check-input" type="checkbox" id="inlineCheckbox1" value="option1">
  <label class="form-check-label" for="inlineCheckbox1">Gmail</label>
</div>
<div class="form-check form-check-inline">
  <input class="form-check-input" type="checkbox" id="inlineCheckbox2" value="option2">
  <label class="form-check-label" for="inlineCheckbox2 ">Whatsapp</label>
</div><br><br>

<div class="dropdown">
  <button class="btn btn-secondary dropdown-toggle" type="button" id="dropdownMenuButton1" data-bs-toggle="dropdown" aria-expanded="false">
    Menu
  </button>
  <ul class="dropdown-menu" aria-labelledby="dropdownMenuButton1">
    <li><a class="dropdown-item" href="#">Cake</a></li>
    <li><a class="dropdown-item" href="#">Cookies</a></li>
    <li><a class="dropdown-item" href="#">Pastries</a></li>
  </ul>
</div><br>
<label for="customRange3" class="form-label">Example range</label>
<input type="range" class="form-range" min="0" max="10" step="1" id="customRange3"><br><br>



    
  
  <div class="d-flex justify-content-center">
  <button class="btn btn-primary" type="button">Submit</button>
  
</div>


        </fieldset>
</form>
