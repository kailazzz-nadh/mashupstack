<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form align="center" action="intro.html" method="get" target="_blank">
        <fieldset>
            <legend>Contact Us</legend>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" placeholder="enter your name" required><br><br>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="enter your email" required><br><br>
            <label for="phone">Phone:</label>
            <input type="tel" id="phone" name="phone" maxlength="10" pattern="[0-9]{10}" placeholder="enter your phone number"><br><br>
            <!-- <label for="sub">select a subject:</label> -->
            <select id="subject" name="subject" required>
                <option value="">Select a subject</option>
                <option value="general">General Inquiry</option>
                <option value="support">Support</option>
                <option value="feedback">Feedback</option>
                </select><br><br>
            <label for="message">Message:</label><br>
            <textarea id="message" name="message" rows="4" cols="50" placeholder="enter your message" required></textarea><br><br>
            <input type="submit" value="Submit">
        </fieldset>
    </form>
   <p align="center">&copy; 2024 <i>Mashup Stack</i>. All rights reserved.</p>
</body>
</html>
