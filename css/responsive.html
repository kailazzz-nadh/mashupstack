<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    
   
    .container{
       position: absolute;
       top: 0px;
       bottom: 0px;
       right: 0px;
       left: 0px;
    display:flex;
    background:white; 

    }
    .left{
        flex: 1;
         min-height: 300px;
       background:linear-gradient(to bottom, rgb(177,177,221),rgb(229,188,112)) ;
       
       
        
        
    }
    
   
     input[type="email"],input[type="password"]
    {
    
        width: 750px;
         display: flex;
    padding:10px;
    margin-right:50px ;
    margin-top:5px;
     margin-bottom:15px;
      /* align-items: center; */
     /* justify-content: center; */

    }
   
    h1{
        color: orangered;
        font-family:sans-serif;
        position: relative;
        left: -329px;
    }
    .right{
        flex: 1;
        flex-direction: column;
          padding: 40px; 
        
    
        display: flex;
       justify-content: center;
       /* margin: 70px; */
       align-items: center;
       
       
    }
    button{
    width: 790px;
    
    padding:10px;
    margin-right: 20px;
    margin-top: 5px;
    
    background:orangered;
    color:white;
    border: none;
    }
    @media(max-width:768px) {
        h1{
             position: relative;
        left: -250px;
        }
        .container{
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .left{
            display: none;
        }
         input[type="email"],input[type="password"]
    {
        display: flex;
        align-items: center;
        justify-content: center;
         width: 600px;
         height: 30px;
         
    padding:10px;
    margin-right:50px ;
    margin-top:5px;
     margin-bottom:15px;

        
        
    }
    label[for="fname"],label[for=pword],label[for=cbox]{
        font-size: 25px;
    }
     button{
    width: 650px;
    font-size: 25px;
    
    
    padding:10px;
    margin-right: 20px;
    margin-top: 5px;
    
    background:orangered;
    color:white;
    border: none;
     }
    }

   
</style>
<body>
    
        <div class="container">
            <div class="left">
                </div>
                <div class="right">
                    
    <h1>Login Form</h1>
    <form>
        <label for="fname" style="font-weight: 900;font-family: sans-serif;">E-mail:</label><br>
        <input type="email" id="fname" name="fname" ><br>
         <label for="pword" style="font-weight: 900; font-family: sans-serif;">Password:</label><br>
          <input type="password" id="pword" name="pword"><br>
          
        <input type="checkbox" id="cbox" name="cbox">
         <label for="cbox" style="font-family: sans-serif;">Remember Me</label><br>
         <button>Login</button>
         
         


    </form>
                    </div>
                </div>
        
    
</body>
</html>
