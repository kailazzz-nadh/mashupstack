<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h3{
            text-align: right;
            color: rgb(255, 0, 0);
            font-family: 'Times New Roman', Times, serif;

}
p{
    text-align: center;
    color: rgb(0, 0, 255);
    font-family:Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
    text-transform: uppercase;
    letter-spacing: 10px;
}

table,th,td{
    border: 5px solid black;
    border-collapse: collapse;
    width: 50%;
    height: 50px;
    margin: 20px auto;
    vertical-align: center;
    text-align: center;
    font-weight: 900;
    font-style: italic;
    background-color: rgb(255, 255, 0);
}
th{
    background-color: rgb(0, 255, 255);}
       </style>
</head>
<body>
    <h3>SAUL GOODMAN AND ASSOCIATES</h3>
    <p>Better Call Saul</p><br><br>
    <table>
        <tr>

        </tr>
        <tr>
            <td>Legal</td>
            <td>+91 1234567890</td>
        </tr>
        <tr>
            <td>oldage Services</td>

        </tr>
    </table>

</html>
