<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form align="center"  method="get" onsubmit="return false;">
        <fieldset>
            <legend>Contact Us</legend>
            <label for="fname">Full name</label>
            <input type="text" id="fname" name="fname" required><br><br>
            <label for="phno">Phone Number</label>
            <input type="tel" id="phno" name="phno" pattern="^\d{10}$"><br><br>
            <select id="reason" name="reason">
                <option value="">Select a reason for contact</option>
                <option value="inquiry">sales</option>
                <option value="support">service</option>
                <option value="feedback">enquiry</option>
            </select><br><br>
            <label for="email">Email </label>
            <input type="email" id="email" name="email"><br><br>
            <label for="message">Message</label><br>
            <textarea id="message" name="message" rows="4" cols="50"></textarea><br><br>
            <input type="submit" value="Submit">
        
        </fieldset>
    
</body>
</html>
