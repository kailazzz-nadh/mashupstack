<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <input type="button" onclick="winner()" value="WIN WIN WINNER"><br><br>
    <h2 id="result"></h2>
    <div class="modal fade" id="winnerModal">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">Lottery Winner</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body" id="modalResult"></div>

        </div>
    </div>
</div>
    <script language="javascript" type="text/javascript">
        var lottery=[222,333,555]
        function winner(){
            var randomIndex = Math.floor(Math.random() * lottery.length);
    var winnerTicket = lottery[randomIndex];

    console.log("Winner: " + winnerTicket);
    window.alert("Winner: " + winnerTicket);

    document.getElementById("result").innerHTML = "Winner Ticket: " + winnerTicket;
    document.getElementById("result").style.color = "red";
     var myModal = new bootstrap.Modal(document.getElementById("winnerModal"));
     document.getElementById("modalResult").innerHTML ="Winner Ticket: " + winnerTicket;
    myModal.show();

        }



    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
