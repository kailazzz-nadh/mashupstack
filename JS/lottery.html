<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="button" onclick="winner()" value="WIN WIN WINNER"><br><br>
    <h2 id="result"></h2>
    <script language="javascript" type="text/javascript">
        var lottery=[222,333,555]
        function winner(){
            var randomIndex = Math.floor(Math.random() * lottery.length);
    var winnerTicket = lottery[randomIndex];

    console.log("Winner: " + winnerTicket);
    window.alert("Winner: " + winnerTicket);

    document.getElementById("result").innerHTML = "Winner Ticket: " + winnerTicket;
    document.getElementById("result").style.color = "red";

        }



    </script>
</body>
</html>
