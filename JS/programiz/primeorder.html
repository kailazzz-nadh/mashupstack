<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script language="javascript" type="text/javascript">
        var min=Number(prompt("enter the starting number"))
        var max=Number(prompt("enter the last number"))
        for(var i=min;i<=max;i++){
            var flag=0
        
            for(var j=2;j<i;j++){
                if(i%j==0){
                    flag=1
                    break;
                }
        }
    
        if(i>1&&flag==0){
            console.log(i)
        }
    }
    </script>
</body>
</html>
