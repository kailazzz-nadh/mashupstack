<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script language="javascript" type="text/javascript">
        var num=Number(prompt("Enter a three digit positive integer"))
        var sum=0
        var temp=num
        while(num>0){
            var rem=temp%10
             sum+=rem*rem*rem
             temp=parseInt(temp/10)

        }
        if(sum==num){
            console.log("is a armstrong number")
        }
        else{
           console.log("is not a armstrong number") 
        }

    </script>
</body>
