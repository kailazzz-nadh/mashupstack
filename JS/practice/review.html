<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
    <h1>Review</h1>
    <script langauge="javascript" type="text/javascript">
        var review = "   The PRODUCT quality is AMAZING!   ";
        var nospace=review.trim();
        var upper=nospace.toUpperCase();
        var replaced=upper.replace(/product/i ,"SERVICE");
        document.write(replaced+"<br>")
        document.write(upper.indexOf("QUALITY")+"<br>")
        var arr=replaced.split(" ")
        var text=" "
        for(var i=0;i<arr.length;i++)
    {
        text+=arr[i]+"<br>";
    }
    document.write(text);





    </script>
</body>
