<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
     <h1>Game Score</h1>
    <p id="demo"></p>
    
     <script language="javascript" type="text/javascript">
        function getrand(){
            return Math.floor(Math.random()*50)+1;

        }
        
        var s= document.getElementById("demo").innerHTML=(getrand());
        var uscore="45";
        document.write(uscore + "<br>");
        document.write(typeof(uscore)+"<br>");
        var newscore=Number(uscore);
        document.write(newscore+"<br>");
        document.write(typeof(newscore)+"<br>");
        var diff= s-newscore;
        document.write("absolute difference between random and score:"+Math.abs(diff)+"<br>") ;
         document.write("root of score:"+Math.sqrt(newscore)+"<br>");
         document.write("log of score:"+Math.log(newscore)+"<br>");
        
        
        document.write("log of pi:"+Math.log(Math.PI)  +"<br>");
        document.write("product:"+"20"*5 +"<br>");
         document.write("maximum:"+Math.max(10,20,s) +"<br>");
          document.write("minimum:"+Math.min(10,20,s) +"<br>");







     </script>
    
</body>
</html>
